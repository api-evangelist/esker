apis:
- aid: esker:esker-on-demand-session-service
  name: Esker on Demand Session Service
  description: 'Entry point of the Esker on Demand Web Service: retrieves the service bindings (GetBindings) and opens or closes an authenticated session (Login, Logout, GetSessionInformation). SOAP 1.1 service (urn:SessionService2); the docs require calling SessionService.GetBindings first because the returned URLs may redirect to another server.'
  humanURL: https://doc.esker.com/eskerondemand/cv_ly/en/webservices/Content/References/API/sessionservice.html
  baseURL: https://as1.ondemand.esker.com/EDPWS/EDPWS.dll?Handler=Default2
  tags:
  - SOAP
  - Web Services
  properties:
  - type: WSDL
    url: wsdl/esker-session-service.wsdl
  - type: WSDL
    name: WSDL (provider-hosted)
    url: https://as1.ondemand.esker.com/EDPWS/EDPWS.dll?Handler=GenSession2WSDL
  - type: Documentation
    url: https://doc.esker.com/eskerondemand/cv_ly/en/webservices/Content/Introduction_v2.html
- aid: esker:esker-on-demand-submission-service
  name: Esker on Demand Submission Service
  description: Manages documents and submits them to Esker on Demand for processing and delivery (fax, mail, email and other transports). SOAP 1.1 service (urn:SubmissionService2); the docs require calling SessionService.GetBindings first because the returned URLs may redirect to another server.
  humanURL: https://doc.esker.com/eskerondemand/cv_ly/en/webservices/Content/References/API/submissionservice.html
  baseURL: https://as1.ondemand.esker.com/EDPWS/EDPWS.dll?Handler=Submission2Handler
  tags:
  - SOAP
  - Web Services
  properties:
  - type: WSDL
    url: wsdl/esker-submission-service.wsdl
  - type: WSDL
    name: WSDL (provider-hosted)
    url: https://as1.ondemand.esker.com/EDPWS/EDPWS.dll?Handler=GenSubmission2WSDL
  - type: Documentation
    url: https://doc.esker.com/eskerondemand/cv_ly/en/webservices/Content/Introduction_v2.html
- aid: esker:esker-on-demand-query-service
  name: Esker on Demand Query Service
  description: 'Queries and manages documents already submitted to Esker on Demand: query transports, attachments and statistics, download files, approve, cancel and resubmit. SOAP 1.1 service (urn:QueryService2); the docs require calling SessionService.GetBindings first because the returned URLs may redirect to another server.'
  humanURL: https://doc.esker.com/eskerondemand/cv_ly/en/webservices/Content/References/API/QueryService_v2.html
