aid: esker

name: Esker

description: Esker is a software company that automates document-driven business processes for the Office of the CFO, with
  cloud solutions spanning Source-to-Pay (accounts payable, procurement) and Order-to-Cash (order management, credit, collections,
  e-invoicing), plus document delivery, fax (VSI-Fax) and terminal emulation products. Its site describes them as document
  automation and order management software that helps businesses cut costs and increase efficiencies. Developers integrate
  through the Esker on Demand Web Services API (SOAP/WSDL session, submission and query services), documented at doc.esker.com.

